<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientific Calculator</title>
<style>
:root{--bg:#f1f2f6;--card:#fff;--text:#1d1f2b;--muted:#7a7f93;--key:#eceef5;--key2:#dfe3ef;--acc:#5b5bf0;--acc-t:#fff;--op:#e3e3ff;--danger:#e5484d;--shadow:0 10px 40px rgba(30,30,80,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e29;--text:#eceefa;--muted:#8a8fa6;--key:#272a38;--key2:#313547;--acc:#7c7cff;--acc-t:#0f1020;--op:#2f3158;--shadow:0 10px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e29;--text:#eceefa;--muted:#8a8fa6;--key:#272a38;--key2:#313547;--acc:#7c7cff;--acc-t:#0f1020;--op:#2f3158;--shadow:0 10px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center;padding:16px}
.wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:760px;align-items:flex-start}
.calc{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);flex:1 1 340px;max-width:400px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top b{font-size:14px;color:var(--muted);letter-spacing:.04em}
.pill{border:0;background:var(--key);color:var(--text);padding:6px 12px;border-radius:99px;font-size:12px;cursor:pointer}
.screen{background:var(--bg);border-radius:14px;padding:12px 14px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{font-size:20px;color:var(--muted);word-break:break-all;min-height:26px}
.res{font-size:34px;font-weight:600;word-break:break-all;min-height:44px}
.res.err{color:var(--danger);font-size:22px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.grid button{border:0;border-radius:12px;padding:14px 0;font-size:16px;background:var(--key);color:var(--text);cursor:pointer;transition:transform .05s,background .15s}
.grid button:hover{background:var(--key2)}
.grid button:active{transform:scale(.95)}
.grid .op{background:var(--op);color:var(--acc)}
.grid .fn{font-size:14px;color:var(--muted)}
.grid .eq{background:var(--acc);color:var(--acc-t);font-weight:700}
.grid .ac{color:var(--danger)}
.hist{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);flex:1 1 240px;max-width:400px;min-height:200px}
.hist h3{margin:0 0 10px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.hist ul{list-style:none;margin:0;padding:0;max-height:420px;overflow-y:auto}
.hist li{padding:10px;border-radius:10px;cursor:pointer;text-align:right}
.hist li:hover{background:var(--bg)}
.hist li small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.hist li span{font-size:18px;font-weight:600}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
.vault{position:fixed;inset:0;background:rgba(10,10,25,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.vault.on{display:flex}
.vbox{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:420px;box-shadow:var(--shadow);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.folder{width:84px;height:64px;margin:0 auto 6px;position:relative}
.folder .back{position:absolute;inset:10px 0 0;background:#e0a826;border-radius:8px}
.folder .tab{position:absolute;left:0;top:0;width:36px;height:16px;background:#e0a826;border-radius:6px 6px 0 0}
.folder .front{position:absolute;inset:18px 0 0;background:#f5c542;border-radius:8px;transform-origin:bottom;animation:open .6s ease forwards}
@keyframes open{to{transform:perspective(200px) rotateX(-35deg)}}
.vbox h2{text-align:center;margin:8px 0 2px}
.vbox p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.vbox textarea{width:100%;height:80px;border-radius:12px;border:1px solid var(--key2);background:var(--bg);color:var(--text);padding:10px;font:inherit;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;border:0;padding:10px;border-radius:10px;background:var(--acc);color:var(--acc-t);font-weight:600;cursor:pointer}
.row .sec{background:var(--key);color:var(--text)}
.notes{list-style:none;padding:0;margin:12px 0 0;max-height:180px;overflow-y:auto}
.notes li{background:var(--bg);border-radius:10px;padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;font-size:14px;word-break:break-word}
.notes button{border:0;background:none;color:var(--danger);cursor:pointer;font-size:16px}
.notes button.dl{color:var(--acc)}
.notes .nm{flex:1;min-width:0}
.notes .nm small{display:block;color:var(--muted);font-size:12px}
.notes li{align-items:center}
.drop{display:block;border:2px dashed var(--key2);border-radius:14px;padding:18px 10px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop.over{border-color:var(--acc);color:var(--acc)}
.notes{max-height:240px}
.notes .nm{cursor:pointer}
#vault{padding:0;align-items:stretch}
#vault .vbox{max-width:none;height:100%;border-radius:0;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px))}
#vault .vbox>:not(.folder){max-width:900px;width:100%;margin-left:auto;margin-right:auto}
#vault .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:none;overflow:visible}
#vault .notes li{margin-bottom:0}
#vault .drop{padding:28px 10px}
.vbox.vw{max-width:640px;max-height:90vh;display:flex;flex-direction:column}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.vhead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vhead div{display:flex;gap:6px;flex-shrink:0}
.vbody{overflow:auto;flex:1;text-align:center}
.vbody img,.vbody video{max-width:100%;max-height:70vh;border-radius:10px}
.vbody audio{width:100%}
.vbody iframe{width:100%;height:65vh;border:0;border-radius:10px;background:#fff}
.vbody pre{text-align:left;white-space:pre-wrap;word-break:break-word;font-size:13px;background:var(--bg);padding:12px;border-radius:10px;margin:0}
:root{--acc:#8b5cf6;--acc-t:#fff;--op:#ede9fe;--bg:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgba(10,8,30,.55);--card:rgba(30,27,62,.82);--key:#26234d;--key2:#35316a;--acc:#a78bfa;--acc-t:#120c2a;--op:#2d2963}}
:root[data-theme="dark"]{--bg:rgba(10,8,30,.55);--card:rgba(30,27,62,.82);--key:#26234d;--key2:#35316a;--acc:#a78bfa;--acc-t:#120c2a;--op:#2d2963}
body{background:linear-gradient(135deg,#c4b5fd,#a5f3fc,#fbcfe8,#c4b5fd);background-size:300% 300%;animation:bgmove 14s ease infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(135deg,#1e1b4b,#0f172a,#3b0764,#1e1b4b);background-size:300% 300%}}
:root[data-theme="dark"] body{background:linear-gradient(135deg,#1e1b4b,#0f172a,#3b0764,#1e1b4b);background-size:300% 300%}
@keyframes bgmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.calc,.hist{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3)}
.screen{box-shadow:inset 0 0 0 1px rgba(139,92,246,.3),0 0 24px rgba(139,92,246,.15)}
.grid button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14)}
.grid button:active{transform:scale(.94);box-shadow:none}
.grid .eq{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;box-shadow:0 6px 20px rgba(139,92,246,.5)}
.grid .eq:hover{box-shadow:0 8px 26px rgba(236,72,153,.55)}
.res{animation:pop2 .25s ease}
@keyframes pop2{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
#vault.on{animation:flash .7s ease}
@keyframes flash{0%{background:rgba(255,255,255,.95)}100%{background:rgba(10,10,25,.6)}}
#vault .vbox{background:radial-gradient(circle at 50% 0%,rgba(139,92,246,.4),transparent 55%),radial-gradient(circle at 90% 100%,rgba(236,72,153,.25),transparent 50%),var(--card)}
.folder{filter:drop-shadow(0 0 18px rgba(245,197,66,.75));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.vbox h2{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.notes li{animation:rise .45s ease both;transition:box-shadow .2s,transform .2s}
.notes li:nth-child(2){animation-delay:.05s}.notes li:nth-child(3){animation-delay:.1s}.notes li:nth-child(4){animation-delay:.15s}.notes li:nth-child(5){animation-delay:.2s}
#vault .notes li:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--acc),0 8px 20px rgba(139,92,246,.3)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.drop:hover{border-color:var(--acc);color:var(--acc);box-shadow:0 0 18px rgba(139,92,246,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--acc:#8b5a2b;--acc-t:#fff;--op:#efe3d3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgba(24,14,8,.55);--card:rgba(40,26,16,.85);--key:#3a2718;--key2:#4f3622;--acc:#c8955a;--acc-t:#24140a;--op:#4a3321}}
:root[data-theme="dark"]{--bg:rgba(24,14,8,.55);--card:rgba(40,26,16,.85);--key:#3a2718;--key2:#4f3622;--acc:#c8955a;--acc-t:#24140a;--op:#4a3321}
body{background:linear-gradient(135deg,#e7d3b8,#d9bf9c,#ecdcc4,#e7d3b8);background-size:300% 300%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(135deg,#2a1a10,#1a120c,#4a2c17,#2a1a10);background-size:300% 300%}}
:root[data-theme="dark"] body{background:linear-gradient(135deg,#2a1a10,#1a120c,#4a2c17,#2a1a10);background-size:300% 300%}
.screen{box-shadow:inset 0 0 0 1px rgba(139,90,43,.35),0 0 24px rgba(139,90,43,.18)}
.grid .eq{background:linear-gradient(135deg,#8b5a2b,#a9713c);color:#fff;box-shadow:0 6px 20px rgba(139,90,43,.5)}
.grid .eq:hover{box-shadow:0 8px 26px rgba(169,113,60,.6)}
#vault .vbox{background:radial-gradient(circle at 50% 0%,rgba(139,90,43,.4),transparent 55%),radial-gradient(circle at 90% 100%,rgba(169,113,60,.25),transparent 50%),var(--card)}
.vbox h2{background:linear-gradient(90deg,#8b5a2b,#a9713c);-webkit-background-clip:text;background-clip:text;color:transparent}
#vault .notes li:hover{box-shadow:0 0 0 1px var(--acc),0 8px 20px rgba(139,90,43,.3)}
.drop:hover{box-shadow:0 0 18px rgba(139,90,43,.25)}
.folder{filter:drop-shadow(0 0 18px rgba(139,90,43,.75))}
.folder .back,.folder .tab{background:#6b4423}
.folder .front{background:#c8955a}
</style>
</head>
<body>
<div class="wrap">
  <div class="calc">
    <div class="top"><b>SCIENTIFIC</b><button class="pill" id="mode">DEG</button></div>
    <div class="screen"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
    <div class="grid" id="keys"></div>
  </div>
  <div class="hist">
    <h3>History <button class="pill" id="clearH">Clear</button></h3>
    <ul id="hlist"></ul>
  </div>
</div>

<div class="vault" id="vault">
  <div class="vbox">
    <div class="folder"><div class="back"></div><div class="tab"></div><div class="front"></div></div>
    <h2>Secret Vault</h2>
    <p id="vinfo">Unlocked. Tap a file to open it.</p>
    <label class="drop" id="drop">＋ Tap to add files, or drop them here<input type="file" id="pick" multiple hidden></label>
    <ul class="notes" id="files"></ul>
    <div class="row"><button class="sec" id="lock">Lock vault</button></div>
  </div>
</div>

<div class="vault" id="viewer" style="z-index:20"><div class="vbox vw"><div class="vhead"><b id="vtitle"></b><div><button class="pill" id="vsave">Save</button><button class="pill" id="vclose">Close</button></div></div><div class="vbody" id="vbody"></div></div></div>

<script>
const SECRET="5+5×5";
let expr="", deg=true, history=[], notes=[];
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
history=store.get("calc-history",[]);notes=store.get("calc-vault",[]);

const layout=[
 ["sin(","fn","sin"],["cos(","fn","cos"],["tan(","fn","tan"],["log(","fn","log"],["ln(","fn","ln"],
 ["sqrt(","fn","√"],["^2","fn","x²"],["^","fn","xⁿ"],["π","fn","π"],["!","fn","n!"],
 ["(","fn","("],[")","fn",")"],["%","fn","%"],["DEL","fn ac","⌫"],["AC","ac","AC"],
 ["7"],["8"],["9"],["÷","op"],["neg","fn","±"],
 ["4"],["5"],["6"],["×","op"],["e","fn","e"],
 ["1"],["2"],["3"],["-","op","−"],["abs(","fn","|x|"],
 ["0"],["."],["ANS","fn","Ans"],["+","op"],["=","eq"]
];
const keys=$("keys");
layout.forEach(([v,c,l])=>{const b=document.createElement("button");b.textContent=l||v;if(c)b.className=c;b.onclick=()=>press(v);keys.appendChild(b)});

function press(v){
  if(v==="AC")expr="";
  else if(v==="DEL")expr=expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|sqrt\(|abs\(|.)$/,"");
  else if(v==="=")return equals();
  else if(v==="neg")expr=expr.startsWith("-")?expr.slice(1):"-"+expr;
  else if(v==="ANS"){if(history.length)expr+=history[0].r}
  else expr+=v;
  render();
}

// Safe recursive-descent parser
function evaluate(s){
  s=s.replace(/×/g,"*").replace(/÷/g,"/");
  let open=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;
  while(open-->0)s+=")";
  const t=s.match(/\d+\.?\d*|\.\d+|[a-zπ]+|[-+*/^()%!]/g)||[];
  let i=0;
  const toRad=x=>deg?x*Math.PI/180:x;
  const F={sin:x=>Math.sin(toRad(x)),cos:x=>Math.cos(toRad(x)),tan:x=>Math.tan(toRad(x)),sqrt:Math.sqrt,log:Math.log10,ln:Math.log,abs:Math.abs};
  const fact=n=>{if(n<0||n!==Math.floor(n)||n>170)throw 0;let r=1;for(let k=2;k<=n;k++)r*=k;return r};
  const peek=()=>t[i],next=()=>t[i++];
  function expr_(){let v=term();while(peek()==="+"||peek()==="-"){v=next()==="+"?v+term():v-term()}return v}
  function term(){let v=unary();for(;;){const p=peek();
    if(p==="*"||p==="/"){next();const r=unary();if(p==="/"&&r===0)throw "Cannot divide by zero";v=p==="*"?v*r:v/r}
    else if(p&&(/^[\d.]/.test(p)||p==="("||p==="π"||p==="e"||F[p])){v*=unary()}
    else return v}}
  function unary(){if(peek()==="-"){next();return -unary()}if(peek()==="+"){next();return unary()}return power()}
  function power(){let b=post();if(peek()==="^"){next();return Math.pow(b,unary())}return b}
  function post(){let v=prim();while(peek()==="%"||peek()==="!"){v=next()==="%"?v/100:fact(v)}return v}
  function prim(){const p=next();
    if(p===undefined)throw 0;
    if(/^[\d.]/.test(p))return parseFloat(p);
    if(p==="π")return Math.PI;
    if(p==="e")return Math.E;
    if(p==="("){const v=expr_();if(next()!==")")throw 0;return v}
    if(F[p]){const a=prim();const r=F[p](a);if(isNaN(r))throw "Invalid input";return r}
    throw 0}
  const r=expr_();
  if(i<t.length)throw 0;
  return r;
}
function fmt(r){
  if(!isFinite(r))throw "Result too large";
  const n=parseFloat(r.toPrecision(12));
  return String(Math.abs(n)>=1e15||(Math.abs(n)<1e-9&&n!==0)?n.toExponential(6):n);
}
function render(){
  $("expr").textContent=expr;
  const res=$("res");res.classList.remove("err");
  if(!expr){res.textContent="0";return}
  try{res.textContent=fmt(evaluate(expr))}catch(e){res.textContent=typeof e==="string"?e:""}
}
function equals(){
  if(expr.replace(/\s/g,"").replace(/[x*]/gi,"×").replace(/\//g,"÷")===SECRET){expr="";render();openVault();return}
  if(!expr)return;
  try{
    const r=fmt(evaluate(expr));
    history.unshift({e:expr,r});history=history.slice(0,50);store.set("calc-history",history);
    expr=r;renderHist();render();
  }catch(e){const res=$("res");res.textContent=typeof e==="string"?e:"Error";res.classList.add("err")}
}
function renderHist(){
  const ul=$("hlist");ul.innerHTML="";
  if(!history.length){ul.innerHTML='<div class="empty">No calculations yet</div>';return}
  history.forEach(h=>{const li=document.createElement("li");
    const s=document.createElement("small");s.textContent=h.e+" =";
    const sp=document.createElement("span");sp.textContent=h.r;
    li.append(s,sp);li.onclick=()=>{expr+=h.r;render()};ul.appendChild(li)});
}
$("clearH").onclick=()=>{history=[];store.set("calc-history",history);renderHist()};
$("mode").onclick=()=>{deg=!deg;$("mode").textContent=deg?"DEG":"RAD";render()};

// Vault
const info=m=>{$("vinfo").textContent=m};
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open("calc-vault-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
idb.catch(()=>{});
const tx=async(mode,fn)=>{const db=await idb;return new Promise((res,rej)=>{const t=db.transaction("f",mode),q=fn(t.objectStore("f"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
const size=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
async function renderFiles(){
  const ul=$("files");ul.innerHTML="";
  let list=[];
  try{list=await tx("readonly",s=>s.getAll())}catch(e){info("File storage isn’t available in this browser.");return}
  list.sort((a,b)=>b.added-a.added);
  if(!list.length){ul.innerHTML='<div class="empty">The vault is empty</div>';return}
  list.forEach(f=>{const li=document.createElement("li");
    const nm=document.createElement("div");nm.className="nm";nm.textContent="📄 "+f.name;
    nm.onclick=()=>openFile(f);nm.title="Open";
    const sm=document.createElement("small");sm.textContent=size(f.size)+" · "+new Date(f.added).toLocaleDateString();nm.appendChild(sm);
    const d=document.createElement("button");d.className="dl";d.textContent="⬇";d.setAttribute("aria-label","Download "+f.name);d.onclick=()=>saveOut(f);
    const x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","Delete "+f.name);
    x.onclick=async()=>{if(!confirm("Delete “"+f.name+"” from the vault?"))return;try{await tx("readwrite",s=>s.delete(f.id))}catch(e){}renderFiles()};
    li.append(nm,d,x);ul.appendChild(li)});
}
async function addFiles(fl){
  let n=0;
  for(const f of fl){
    try{await tx("readwrite",s=>s.put({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),name:f.name,size:f.size,type:f.type,added:Date.now(),blob:f}));n++}
    catch(e){info("Couldn’t store “"+f.name+"” (storage may be full).")}
  }
  if(n)info(n+" file"+(n>1?"s":"")+" stored privately on this device.");
  renderFiles();
}
async function saveOut(f){
  let dls=null;
  try{dls=window.claude&&await claude.use("downloads")}catch(e){}
  if(!dls){try{const u=URL.createObjectURL(f.blob),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){info("Saving files out isn’t available in this view.")}return}
  try{await dls.save({filename:f.name,data:f.blob});info("Saved “"+f.name+"”.")}
  catch(e){if(e&&e.code==="declined")return;info(e&&e.code==="rejected_extension"?"This file type can’t be exported from here.":"Couldn’t save that file.")}
}
let curURL=null;
function closeViewer(){$("viewer").classList.remove("on");$("vbody").innerHTML="";if(curURL){URL.revokeObjectURL(curURL);curURL=null}}
async function openFile(f){
  const b=$("vbody");closeViewer();$("vtitle").textContent=f.name;$("viewer").classList.add("on");
  $("vsave").onclick=()=>saveOut(f);
  const t=f.type||"",n=f.name.toLowerCase();
  const fail=()=>{b.innerHTML="";const p=document.createElement("p");p.className="empty";p.textContent="Can’t preview this file here. Use Save to export it.";b.appendChild(p)};
  try{
    if(t.startsWith("image/")){
      const url=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f.blob)});
      const im=new Image();im.alt=f.name;im.onerror=fail;im.src=url;b.appendChild(im)}
    else if(t.startsWith("text/")||t==="application/json"||/\.(txt|md|json|csv|log|xml|js|css|html)$/.test(n)){
      const pre=document.createElement("pre");pre.textContent=(await f.blob.text()).slice(0,200000);b.appendChild(pre)}
    else if(t.startsWith("video/")||t.startsWith("audio/")){
      curURL=URL.createObjectURL(f.blob);const m=document.createElement(t.startsWith("video/")?"video":"audio");m.controls=true;m.onerror=fail;m.src=curURL;b.appendChild(m)}
    else if(t==="application/pdf"){
      curURL=URL.createObjectURL(f.blob);const fr=document.createElement("iframe");fr.src=curURL;b.appendChild(fr)}
    else fail();
  }catch(e){fail()}
}
$("vclose").onclick=closeViewer;
$("pick").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
const dz=$("drop");
["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));
function openVault(){renderFiles();const v=$("vault"),f=v.querySelector(".front");f.style.animation="none";void f.offsetWidth;f.style.animation="";v.classList.add("on")}
$("lock").onclick=()=>{closeViewer();$("vault").classList.remove("on")};

// Keyboard
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||$("vault").classList.contains("on"))return;
  const k=e.key;
  if(/^[0-9.+\-()^%!]$/.test(k))press(k);
  else if(k==="*"||k==="x"||k==="X")press("×");else if(k==="/"){e.preventDefault();press("÷")}
  else if(k==="Enter"||k==="="){e.preventDefault();press("=")}
  else if(k==="Backspace")press("DEL");else if(k==="Escape")press("AC");
});
renderHist();render();
</script>
